policy_version: "0.1"
policy_id: TITMAS-SCOUT-AGENT-REVIEW-POLICY-V0.1
default_mode: AGENT_QUORUM

required_reviewers:
  - DISCOVERY_REVIEWER
  - EVIDENCE_REVIEWER
  - SCOPE_REVIEWER
  - QUALITY_REVIEWER
  - RISK_REVIEWER

reviewer_decisions:
  - PASS
  - BLOCKING_FAIL

aggregation:
  blocking_failure: DENY
  missing_evidence: BLOCKED_BY_MISSING_EVIDENCE
  conflict: BLOCKED_BY_CONFLICT
  all_pass: ALLOW

agent_authorizable_actions:
  - PUBLIC_READ
  - CREATE_FORK
  - PUSH_PERSONAL_BRANCH
  - OPEN_DRAFT_PR
  - MARK_PR_READY_FOR_REVIEW
  - POST_BOUNDED_TECHNICAL_COMMENT
  - UPDATE_SCOUT_STATUS

human_exception_actions:
  - SIGN_LEGAL_AGREEMENT
  - MAKE_PAYMENT
  - SUBMIT_BINDING_BID
  - MAKE_IRREVOCABLE_IDENTITY_COMMITMENT
  - DISCLOSE_RESTRICTED_DATA
  - DISCLOSE_SECRET_OR_KEY
  - DELETE_REMOTE_ASSET
  - CHANGE_ACCOUNT_SECURITY
  - MERGE_PROTECTED_BRANCH

unknown_action: DENY
