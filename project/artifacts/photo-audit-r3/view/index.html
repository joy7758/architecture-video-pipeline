<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹳雀楼 · 照片逐项对照</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5dd;color:#30362f;font:14px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #aaa}h1{font-size:21px;margin:0 0 8px}header p{margin:0;color:#626b60;font-size:12px}.tools{display:flex;gap:8px;margin-top:12px}button,a{font:inherit;border:1px solid #92998b;background:#f8f6ee;color:inherit;padding:7px 12px;text-decoration:none;border-radius:4px;cursor:pointer}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1120px;margin:18px auto;padding:0 12px}.panel{min-width:0}.label{font-weight:600;padding:7px 0}.frame{position:relative;aspect-ratio:500/671;background:#ddd;overflow:hidden}.frame img,.frame iframe{width:100%;height:100%;object-fit:contain;display:block;border:0}.line{position:absolute;left:0;right:0;border-top:1px dashed #ffffff85;pointer-events:none;z-index:2}.line span{position:absolute;font-size:9px;color:#fff;background:#30352caa;top:-7px;left:3px;padding:1px 3px}.notes{max-width:1100px;padding:0 20px 25px;margin:auto;line-height:1.7}.notes p{margin:6px 0}small{color:#67725f}@media(max-width:600px){header{padding:12px}.panels{gap:5px;padding:0 5px}.label{font-size:11px}.tools{flex-wrap:wrap}button,a{font-size:12px}.line span{font-size:8px}.notes{font-size:12px}}</style><header><h1>鹳雀楼：照片与当前模型</h1><p>左侧为你提供的原照片，右侧为可旋转的三维模型。并排检查轮廓与层次；镜头仅为相近方位，尚未做精确透视配准。</p><div class="tools"><button onclick="setPhoto(2)">照片 2</button><button onclick="setPhoto(1)">照片 1</button><button onclick="document.querySelector('iframe').src='http://127.0.0.1:4187/?inspection=1'">模型归位</button><a href="http://127.0.0.1:4187/" target="_blank">打开完整效果</a></div></header><div class="panels"><section class="panel"><div class="label" id="photo-label">用户照片 2 · 原图</div><div class="frame"><img id="reference" src="reference-02.png" alt="用户提供的鹳雀楼照片"><div id="guides"></div></div></section><section class="panel"><div class="label">当前模型 · 可拖动、缩放</div><div class="frame"><iframe title="鹳雀楼三维对照模型" src="http://127.0.0.1:4187/?inspection=1"></iframe></div></section></div><section class="notes"><p><b>本轮重点：</b>主歇山顶应明显高于抱厦；最高平座略宽于顶檐；层间依次是栏杆、平台、斗栱承托带、环绕腰檐；首层上部是一条低暗构架带。</p><p>门窗应以深朱褐实面为主，浅色集中在外框和横向彩画。台阶分长、短两段上高台，再经低台阶到楼身。</p><small>仍需核对：屋面谷线与翼角、台基侧翼、细部彩画、所有题字。此页面不宣称复原合格。</small></section><script>const points={2:[[.28,'顶檐/抱厦'],[.33,'最高平座'],[.38,'上腰檐'],[.455,'中层平座'],[.503,'下腰檐'],[.557,'副阶檐'],[.63,'楼身台顶']],1:[[.28,'顶檐'],[.318,'最高平座'],[.345,'上腰檐'],[.397,'中层平座'],[.43,'下腰檐'],[.474,'副阶檐'],[.52,'楼身台顶']]};function setPhoto(n){document.getElementById('reference').src=`reference-0${n}.png`;document.getElementById('photo-label').textContent=`用户照片 ${n} · 原图`;document.getElementById('guides').innerHTML=points[n].map(([t,s])=>`<div class="line" style="top:${t*100}%"><span>${s}</span></div>`).join('')}setPhoto(2)</script></html>
